spring.application.name=hrm-system

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HRM_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# spring.security.user.name=admin
# spring.security.user.password=123456

server.port=8081

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Cấu hình tính lương tự động
hrm.salary.standard-working-days=26
hrm.salary.attendance-bonus=500000
hrm.salary.late-penalty-per-day=100000
hrm.salary.work-start-time=08:00

# Nên đặt các giá trị nhạy cảm qua biến môi trường khi triển khai thực tế.
